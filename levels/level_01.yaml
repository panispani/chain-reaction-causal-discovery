id: "level_01"
cell_size: 1.0

layout: |
  WWWWWWWW
  W......W
  W..B...W
  W......W
  W......W
  W......W
  W.XYZ..W
  W.RRR..W
  W....T.W
  WWWWWWWW

legend:
